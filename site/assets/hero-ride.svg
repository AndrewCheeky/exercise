      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset=".5" stop-color="#d9480f"/>
      <stop offset=".8" stop-color="#fc6a1e"/>
      <stop offset="1" stop-color="#ffc078"/>
    </linearGradient>
    <radialGradient id="sunr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".6" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
