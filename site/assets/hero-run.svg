<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A runner on a coastal road at sunrise, with mountains behind">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset=".45" stop-color="#c2410c"/>
      <stop offset=".75" stop-color="#fc6a1e"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".6" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#7a2e18"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1110" cy="320" r="200" fill="url(#sun)"/>
  <circle cx="1110" cy="320" r="66" fill="#fff1d0"/>
