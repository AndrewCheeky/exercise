  <path d="M960 408 h320 M1000 424 h240 M1040 440 h160" stroke="#ffe2b8" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- road / promenade -->
  <path d="M0 462 L1600 450 L1600 560 L0 560Z" fill="#2a1d24"/>
  <path d="M0 500 L1600 488" stroke="#fc6a1e" stroke-width="4" stroke-dasharray="40 30" opacity=".7"/>
