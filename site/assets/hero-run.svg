  <g transform="translate(1030 222) scale(1.25)" stroke="#16101a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="62" cy="18" r="17" fill="#16101a" stroke="none"/>
    <path d="M56 40 L38 112" stroke-width="22"/>
