    <path d="M1460 456 C1466 404 1474 362 1490 318 L1498 320 C1484 364 1478 406 1474 456Z"/>
    <path d="M1494 318 c-36 -16 -72 -4 -94 14 c30 -10 64 -10 92 -6z M1494 318 c28 -30 70 -36 96 -24 c-32 2 -64 12 -88 32z M1494 318 c-8 -36 -40 -60 -74 -64 c28 14 50 36 64 68z"/>
